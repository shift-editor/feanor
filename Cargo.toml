[workspace]
resolver = "2"
members = ["crates/feanor", "crates/feanor-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# fea-rs depends on smol_str 0.3, which needs Rust 1.89
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Kostya Farber"]
repository = "https://github.com/shift-editor/feanor"
keywords = ["opentype", "fonts", "fea", "linter", "formatter"]

[workspace.dependencies]
fea-rs = "1.0"
feanor = { path = "crates/feanor", version = "0.1.0" }

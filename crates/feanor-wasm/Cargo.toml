[package]
name = "feanor-wasm"
description = "WebAssembly bindings for feanor, the OpenType feature file formatter and linter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# distributed on npm (see build.sh), not crates.io
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
feanor = { workspace = true }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# must match the wasm-bindgen-cli that generates the JavaScript (see build.sh)
wasm-bindgen = "=0.2.127"

[package]
name = "feanor"
description = "Formatter and linter for OpenType feature files (.fea), built on fea-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools", "text-processing", "parser-implementations"]
readme = "README.md"

[dependencies]
fea-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml_edit = "0.23"
# `verify`: compile into a stand-in font and shape it
harfrust = { version = "0.13", optional = true }
write-fonts = { version = "0.52", optional = true }

[features]
default = []
verify = ["dep:harfrust", "dep:write-fonts"]

[[test]]
name = "verify"
required-features = ["verify"]
